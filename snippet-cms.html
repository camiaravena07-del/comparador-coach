    if (cache[src]) return Promise.resolve(cache[src]);
    return new Promise(function (res) {
      var img = new Image(); img.crossOrigin = 'anonymous';
      img.onload = function () {
        var cc = P.colors.filter(function (c) { return c.img === src; })[0] || {}, fb = Object.assign({}, P.fallback, cc.fb), N = img.naturalWidth;
        var geo = { src: src, raw: true, cmPerPx: P.dims.w / (fb.bodyW * N), x0: fb.left * N, y0: fb.top * N, w: (fb.right - fb.left) * N, h: (fb.bottom - fb.top) * N, topX: fb.topX * N, N: N };
        try {
          var W = 900, H = Math.round(img.naturalHeight * W / img.naturalWidth);
          var c = document.createElement('canvas'); c.width = W; c.height = H;
          var x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H);
          var id = x.getImageData(0, 0, W, H), d = id.data, n = W * H;
          var bg = new Uint8Array(n), seen = new Uint8Array(n);
          for (var i = 0; i < n; i++) { var r = d[i*4], g = d[i*4+1], b = d[i*4+2], mx = Math.max(r,g,b), mn = Math.min(r,g,b); bg[i] = ((r+g+b)/3 > 165 && mx - mn <= 22) ? 1 : 0; }
          // regiones de fondo: borde + huecos grandes (ej. dentro del asa)
          for (var s0 = 0; s0 < n; s0++) {
            if (!bg[s0] || seen[s0]) continue;
            var st = [s0], comp = [], edge = false; seen[s0] = 1;
            while (st.length) { var p = st.pop(); comp.push(p); var px = p % W, py = (p / W) | 0;
              if (px === 0 || py === 0 || px === W-1 || py === H-1) edge = true;
              var nb = [p-1, p+1, p-W, p+W];
              for (var k = 0; k < 4; k++) { var q = nb[k]; if (q < 0 || q >= n) continue; if ((k === 0 && px === 0) || (k === 1 && px === W-1)) continue; if (bg[q] && !seen[q]) { seen[q] = 1; st.push(q); } } }
            if (edge || comp.length > n * 0.0015) for (var j = 0; j < comp.length; j++) d[comp[j]*4+3] = 0;
          }
          var minx = W, miny = H, maxx = 0, maxy = 0;
          for (var yy = 0; yy < H; yy++) for (var xx = 0; xx < W; xx++) if (d[(yy*W+xx)*4+3]) { if (xx < minx) minx = xx; if (xx > maxx) maxx = xx; if (yy < miny) miny = yy; if (yy > maxy) maxy = yy; }
          // ancho de cuerpo = fila más ancha en el 40% inferior
          var bodyW = 0, topX = minx;
          for (yy = Math.round(maxy - (maxy - miny) * .4); yy <= maxy; yy++) { var l = -1, r2 = -1; for (xx = minx; xx <= maxx; xx++) if (d[(yy*W+xx)*4+3]) { if (l < 0) l = xx; r2 = xx; } if (r2 - l > bodyW) bodyW = r2 - l; }
          for (xx = minx; xx <= maxx; xx++) if (d[(miny*W+xx)*4+3]) { topX = xx; break; }
          x.putImageData(id, 0, 0);
          var o = document.createElement('canvas'); o.width = maxx - minx + 1; o.height = maxy - miny + 1;
          o.getContext('2d').drawImage(c, minx, miny, o.width, o.height, 0, 0, o.width, o.height);
          geo = { src: o.toDataURL('image/png'), raw: false, cmPerPx: P.dims.w / bodyW, x0: 0, y0: 0, w: o.width, h: o.height, topX: topX - minx };
        } catch (e) { /* imagen de otro dominio: se usa geometría de respaldo */ }
        cache[src] = geo; res(geo);
      };
      img.onerror = function () { if (img.crossOrigin) { img.removeAttribute('crossorigin'); img.src = src + (src.indexOf('?') < 0 ? '?' : '&') + 'nc=1'; } else res(null); };
      img.src = src;
    });
  }

  /* imagen del bolso en SVG, en cm. Devuelve {node,w,h} */
  function bagNode(g, x, y) {
    var k = g.cmPerPx, gg = sv('g', {});
    if (g.raw) {
      var N = g.N, cp = 'axvc' + Math.random().toString(36).slice(2, 7);
      var clip = sv('clipPath', { id: cp }); clip.appendChild(sv('rect', { x: x, y: y, width: g.w * k, height: g.h * k })); gg.appendChild(clip);
      var im = sv('image', { href: g.src, x: x - g.x0 * k, y: y - g.y0 * k, width: N * k, height: N * k, 'clip-path': 'url(#' + cp + ')', style: 'mix-blend-mode:multiply' });
      gg.appendChild(im);
    } else gg.appendChild(sv('image', { href: g.src, x: x, y: y, width: g.w * k, height: g.h * k }));
    return { node: gg, w: g.w * k, h: g.h * k };
  }

  /* silueta femenina, unidades cm, referencia 170 cm, (0,0)=coronilla */
  function figure(H, sx) {
    var s = H / 170, g = sv('g', { transform: 'translate(0,' + (190 - H) + ') scale(' + (s * sx) + ',' + s + ')', fill: '#8E8E8E' });
    g.appendChild(sv('ellipse', { cx: 0, cy: 11, rx: 7.6 / sx, ry: 10.5 }));
    g.appendChild(sv('path', { d: 'M-3.6 18h7.2v10h-7.2z' }));
    g.appendChild(sv('path', { d: 'M-3.6 26C-9 27.5-15 28-17.5 31L-16 46C-15.5 54-13 60-12.5 66C-13 74-17.5 80-18 88C-18 100-16 113-15 124L-13 148C-12.5 157-11 163-11 167L-13 170H-4.5L-5 166C-5 158-6 150-5.5 140L-3.5 124C-2.5 112-1.5 100-.8 92H.8C1.5 100 2.5 112 3.5 124L5.5 140C6 150 5 158 5 166L4.5 170H13L11 167C11 163 12.5 157 13 148L15 124C16 113 18 100 18 88C17.5 80 13 74 12.5 66C13 60 15.5 54 16 46L17.5 31C15 28 9 27.5 3.6 26Z' }));
    var arm = 'M-17.5 30C-21 30.5-22.2 34-22.2 38L-23 63C-23.2 72-23 80-22.6 88C-23 95-22 101-20.3 102C-18.8 101.5-18.4 95-18.8 88L-18.4 64L-17 42Z';
    g.appendChild(sv('path', { d: arm }));
    var a2 = sv('path', { d: arm, transform: 'scale(-1,1)' }); g.appendChild(a2);
    return { node: g, shoulderX: -18.5 * s * sx, shoulderY: 190 - H + 29.5 * s };
  }

  function objNode(key, x, y) {
    var o = OBJ[key];
    if (o.rect) { var g = sv('g', {}); g.appendChild(sv('rect', { x: x, y: y, width: o.w, height: o.h, rx: 1.4, fill: '#C9CBCF', stroke: '#9EA1A6', 'stroke-width': .25 })); g.appendChild(sv('rect', { x: x + .8, y: y + .8, width: o.w - 1.6, height: o.h - 1.6, rx: 1, fill: 'none', stroke: '#B5B8BC', 'stroke-width': .2 })); return g; }
    return sv('image', { href: o.src, x: x, y: y, width: o.w, height: o.h });
  }
  function label(svg, x, y, t, size) { var e = sv('text', { x: x, y: y, 'text-anchor': 'middle', 'font-size': size || 2.2, fill: '#555', 'font-family': 'Helvetica Neue,Arial,sans-serif' }); e.textContent = t; svg.appendChild(e); }

  function setView(svg, bx, by, bw, bh, focus) {
    var z = S.zoom, cx = focus ? focus[0] : bx + bw / 2, cy = focus ? focus[1] : by + bh / 2;
    var w = bw / z, h = bh / z;
    svg.setAttribute('viewBox', [cx - w / 2, cy - h / 2, w, h].join(' '));
  }

  /* ===== Render ===== */
  var root, stage;
  function render(svgOnly) {
    var c = P.colors[S.color];
    if (svgOnly && stage.querySelector('svg')) { var hv = stage.querySelector('[data-hv]'), sz = stage.querySelector('[data-sv]'); if (hv) hv.textContent = (S.height / 100).toFixed(2).replace('.', ',') + ' m'; if (sz) sz.textContent = SIZES[S.size][0]; }
    root.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
    root.querySelectorAll('.axv-sw button').forEach(function (b, i) { b.classList.toggle('on', i === S.color); });
    root.querySelector('.axv-chips').style.display = S.tab === 'cmp' ? 'flex' : 'none';
    root.querySelectorAll('.axv-chip').forEach(function (b) { b.classList.toggle('on', b.dataset.cmp === S.cmp); });
    if (!cache[c.img]) stage.innerHTML = '<div class="axv-load">Cargando…</div>';
    cutout(c.img).then(function (g) {
      if (!g) { stage.innerHTML = '<div class="axv-load">No se pudo cargar la imagen</div>'; return; }
      var svg = sv('svg', { preserveAspectRatio: 'xMidYMid meet', class: svgOnly ? '' : 'axv-fade' });
      var ui = '<div class="axv-zoom"><button data-z="1" aria-label="Acercar">+</button><button data-z="-1" aria-label="Alejar">−</button></div>';
      if (S.tab === 'fit') {
        var b = bagNode(g, 0, 0); svg.appendChild(b.node);
        label(svg, b.w / 2, b.h + 4, fmt(P.dims.w) + ' × ' + fmt(P.dims.h) + ' × ' + fmt(P.dims.d) + ' cm');
        var items = P.levels[S.level].slice().sort(function (a, z) { return OBJ[z].h - OBJ[a].h; });
        var areaW = Math.max(b.w, 42), ox = b.w + 6, x = ox, y = 0, rowH = 0, gap = 2.5;
        items.forEach(function (k) { var o = OBJ[k]; if (x + o.w > ox + areaW) { x = ox; y += rowH + gap; rowH = 0; } svg.appendChild(objNode(k, x, y)); x += o.w + gap; rowH = Math.max(rowH, o.h); });
        var tw = ox + areaW, th = Math.max(b.h, y + rowH) + 8;
        setView(svg, -4, -6, tw + 8, th + 14);
        ui += '<div class="axv-pills">' + [['light', 'Ligero'], ['half', 'Medio'], ['full', 'Lleno']].map(function (l) { return '<button data-lv="' + l[0] + '" class="' + (S.level === l[0] ? 'on' : '') + '">' + l[1] + '</button>'; }).join('') + '</div>';
        ui += '<div class="axv-note">Objetos a escala real. Referencial: lo que cabe depende de cómo se acomoden.</div>';
      } else if (S.cmp === 'silhouette') {
        var f = figure(S.height, SIZES[S.size][1]); svg.appendChild(f.node);
        var k = g.cmPerPx, bx = f.shoulderX - g.topX * k, by = f.shoulderY - 1.5;
        var bn = bagNode(g, bx, by); svg.appendChild(bn.node);
        svg.appendChild(sv('line', { x1: -60, x2: 60, y1: 190, y2: 190, stroke: '#d6d6d6', 'stroke-width': .4 }));
        setView(svg, -55, -6, 110, 200, S.zoom > 1 ? [bx + bn.w / 2, by + bn.h / 2] : null);
        ui += '<div class="axv-side"><label>Estatura <b data-hv>' + (S.height / 100).toFixed(2).replace('.', ',') + ' m</b><input type="range" min="150" max="185" step="1" value="' + S.height + '" data-h></label>' +
              '<label>Talla <b data-sv>' + SIZES[S.size][0] + '</b><input type="range" min="0" max="4" step="1" value="' + S.size + '" data-s></label></div>';
        ui += '<div class="axv-note">Asa con caída de ' + fmt(P.dims.drop) + ' cm</div>';
      } else {
        var b2 = bagNode(g, 0, 0), o = OBJ[S.cmp], gap2 = 8;
        var base = b2.h; svg.appendChild(b2.node);
        svg.appendChild(objNode(S.cmp, b2.w + gap2, base - o.h));
        label(svg, b2.w / 2, base + 4, fmt(P.dims.w) + ' × ' + fmt(P.dims.h) + ' cm');
        label(svg, b2.w + gap2 + o.w / 2, base + 4, o.label + (S.cmp === 'laptop' ? ' · 32 × 22 cm' : ''));
        svg.appendChild(sv('line', { x1: -5, x2: b2.w + gap2 + o.w + 5, y1: base + .3, y2: base + .3, stroke: '#d6d6d6', 'stroke-width': .3 }));
        setView(svg, -6, -6, b2.w + gap2 + o.w + 12, base + 16);
      }
      if (svgOnly && stage.querySelector('svg')) { stage.replaceChild(svg, stage.querySelector('svg')); return; }
      stage.innerHTML = ''; stage.appendChild(svg); stage.insertAdjacentHTML('beforeend', ui);
    });
  }

  function build() {
    var ov = el('div', { class: 'axv-ov', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Tamaño real' });
    ov.innerHTML = '<div class="axv"><button class="axv-x" aria-label="Cerrar">×</button><div class="axv-stage"></div>' +
      '<div class="axv-tabs"><button data-tab="fit">¿Qué cabe?</button><button data-tab="cmp">Comparar</button></div>' +
      '<div class="axv-chips">' + CMP.map(function (k) { return '<button class="axv-chip" data-cmp="' + k + '">' + (k === 'silhouette' ? 'En el cuerpo' : OBJ[k].label) + '</button>'; }).join('') + '</div>' +
      '<div class="axv-sw">' + P.colors.map(function (c, i) { return '<button aria-label="' + c.label + '" data-c="' + i + '" style="background-image:url(\'' + c.img + '\')"></button>'; }).join('') + '</div>' +
      '<div class="axv-foot"><div><h4>' + P.name + '</h4><p>' + P.price + '</p></div><button class="axv-atc">Agregar al carrito</button></div></div>';
    document.body.appendChild(ov);
    root = ov; stage = ov.querySelector('.axv-stage');
    ov.addEventListener('click', function (e) {
      var t = e.target.closest('button'); if (e.target === ov) return close(); if (!t) return;
      if (t.classList.contains('axv-x')) return close();
      if (t.dataset.tab) { S.tab = t.dataset.tab; S.zoom = 1; track('tab', S.tab); }
      else if (t.dataset.cmp) { S.cmp = t.dataset.cmp; S.zoom = 1; track('compare', S.cmp); }
      else if (t.dataset.lv) { S.level = t.dataset.lv; track('level', S.level); }
      else if (t.dataset.c) { S.color = +t.dataset.c; track('color', P.colors[S.color].label); }
      else if (t.dataset.z) { S.zoom = Math.min(3, Math.max(1, S.zoom + (+t.dataset.z) * .5)); }
      else if (t.classList.contains('axv-atc')) { track('add_to_cart'); close(); var a = document.querySelector('#product-addtocart-button'); if (a) a.click(); return; }
      else return;
      render();
    });
    ov.addEventListener('input', function (e) {
      if (e.target.dataset.h != null) { S.height = +e.target.value; }
      else if (e.target.dataset.s != null) { S.size = +e.target.value; } else return;
      render(true);
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ov.classList.contains('on')) close(); });
  }
  function open() { if (!root) build(); root.classList.add('on'); document.documentElement.style.overflow = 'hidden'; track('open'); render(); }
  function close() { root.classList.remove('on'); document.documentElement.style.overflow = ''; }
  document.addEventListener('click', function (e) { if (e.target.closest('[data-axv-open]')) { e.preventDefault(); open(); } });
  window.AxoSizeViz = { open: open };
})();
</script>
